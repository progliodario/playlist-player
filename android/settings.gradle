// Android app: Trusted Web Activity for the web app + native ad-free player.
// See docs/sviluppo/android.md.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // NewPipeExtractor (native player) is published only on JitPack.
        maven {
            url 'https://jitpack.io'
            content { includeGroup 'com.github.TeamNewPipe' }
        }
    }
}

rootProject.name = 'PlaylistPlayer'
include ':app'
