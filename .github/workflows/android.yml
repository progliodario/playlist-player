# Builds the Android APK (Trusted Web Activity + native ad-free player, see
# docs/sviluppo/android.md) after running its unit tests.
#
#  - push of a tag "vX.Y.Z" -> builds and publishes a GitHub Release with the APK
#    (the tag must match android.versionName in app.config.json)
#  - "Run workflow" from the Actions tab -> builds the APK as a downloadable artifact
#  - pull request touching android/ -> checks that the APK still builds (e.g. Dependabot)
#
# Signing key: GitHub secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Without them a throwaway debug key is used
# (always the case for pull requests, which cannot read the secrets).
name: Android APK

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['android/**', 'app.config.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Gradle version compatible with the Android Gradle Plugin in android/build.gradle.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Read version from app.config.json
        id: version
        run: echo "name=$(jq -r .android.versionName app.config.json)" >> "$GITHUB_OUTPUT"

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "$GITHUB_REF_NAME" != "v${{ steps.version.outputs.name }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match android.versionName (${{ steps.version.outputs.name }}) in app.config.json"
            exit 1
          fi

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key in secrets: the APK is signed with a temporary debug key."
          fi

      - name: Unit tests and APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Up to 3 attempts: dependency downloads can fail with temporary HTTP 429 errors.
        run: |
          for attempt in 1 2; do
            if gradle -p android testReleaseUnitTest assembleRelease --no-daemon; then exit 0; fi
            echo "::warning::Gradle attempt $attempt failed, retrying in $((attempt * 60))s"
            sleep $((attempt * 60))
          done
          gradle -p android testReleaseUnitTest assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "playlist-player-${{ steps.version.outputs.name }}.apk"

      - name: Print signing certificate (SHA-256 needed for Digital Asset Links)
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          {
            echo '### Signing certificate'
            echo '```'
            "${BUILD_TOOLS}apksigner" verify --print-certs playlist-player-*.apk
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The URL bar is hidden only if the site's assetlinks.json lists this certificate
      # (file in the repository progliodario.github.io). Warns instead of failing: the APK works anyway.
      - name: Check Digital Asset Links
        if: env.ANDROID_KEYSTORE_PATH != ''
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          CERT=$("${BUILD_TOOLS}apksigner" verify --print-certs playlist-player-*.apk \
            | sed -n 's/.*SHA-256 digest: //p' | head -1 | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          HOST=$(jq -r .publicUrl app.config.json | sed -E 's#^https://([^/]+).*#\1#')
          URL="https://$HOST/.well-known/assetlinks.json"
          if curl -fsSL "$URL" | grep -q "$CERT"; then
            echo "Digital Asset Links OK: $URL lists $CERT" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::$URL does not list $CERT, so the app shows a URL bar. See docs/sviluppo/android.md"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: playlist-player-apk
          path: playlist-player-*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        # The Windows workflow may create the Release at the same time: retry a few times.
        run: |
          NOTES="Android: scarica playlist-player-VERSIONE.apk, aprilo e consenti l'installazione (serve Google Chrome). Windows: scarica playlist-player-setup.exe e aprilo (se Windows avvisa: Ulteriori informazioni, Esegui comunque). Entrambe hanno il lettore senza pubblicità che continua in background. Guida: docs/utente/installazione.md"
          for attempt in 1 2 3 4 5; do
            if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" playlist-player-*.apk --clobber && exit 0
            elif gh release create "$GITHUB_REF_NAME" playlist-player-*.apk                 --title "$GITHUB_REF_NAME" --notes "$NOTES" --generate-notes; then
              exit 0
            fi
            sleep $((attempt * 20))
          done
          exit 1
