# Builds the web app, regenerates the public playlist catalog of the channel and
# publishes everything to GitHub Pages (app.config.json -> publicUrl).
#
# Runs on every push to main, once a day (to pick up playlist changes on YouTube),
# and manually from the Actions tab ("Run workflow").
# Note: GitHub disables scheduled workflows after 60 days without repository activity;
# re-enable it from the Actions tab if that happens. See docs/DEPLOY.md.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install yt-dlp
        run: pipx install yt-dlp

      - name: Build playlist catalog
        # If YouTube cannot be read from CI, reuse the catalog that is already online.
        run: npm run catalog -- --fallback-to-published

      - name: Build web app
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
