# Monthly dependency update pull requests. CI must pass before merging them.
# Major upgrades listed under `ignore` need a deliberate migration: see docs/DECISIONS.md.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (D7).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Types must match the Node major used by the project (.nvmrc).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    ignore:
      # A new Android Gradle Plugin major also needs a new Gradle version in
      # .github/workflows/android.yml and possibly build script changes (D10).
      - dependency-name: com.android.application
        update-types: [version-update:semver-major]
